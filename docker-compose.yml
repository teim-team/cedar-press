name: cedar-press-local

x-stripe-environment: &stripe-environment
  CEDAR_PRESS_STRIPE_SECRET_KEY: ${CEDAR_PRESS_STRIPE_SECRET_KEY:-${STRIPE_TEST_KEY:-}}
  CEDAR_PRESS_STRIPE_MODE: ${CEDAR_PRESS_STRIPE_MODE:-test}
  CEDAR_PRESS_STRIPE_LEGACY_PRICES: ${CEDAR_PRESS_STRIPE_LEGACY_PRICES:-[]}
  CEDAR_PRESS_STRIPE_PRICES: ${CEDAR_PRESS_STRIPE_PRICES:-}
  CEDAR_PRESS_STRIPE_PORTALS: ${CEDAR_PRESS_STRIPE_PORTALS:-}
  CEDAR_PRESS_STRIPE_SUMMIT_COUPON: ${CEDAR_PRESS_STRIPE_SUMMIT_COUPON:-}
  CEDAR_PRESS_STRIPE_WEBHOOK_SECRET: ${CEDAR_PRESS_STRIPE_WEBHOOK_SECRET:-}
  CEDAR_PRESS_SMTP_HOST: ${CEDAR_PRESS_SMTP_HOST:-mailpit}
  CEDAR_PRESS_SMTP_PORT: ${CEDAR_PRESS_SMTP_PORT:-1025}
  CEDAR_PRESS_SMTP_STARTTLS: ${CEDAR_PRESS_SMTP_STARTTLS:-0}
  CEDAR_PRESS_EMAIL_FROM: ${CEDAR_PRESS_EMAIL_FROM:-Cedar Press <accounts@cedarpress.local>}
  CEDAR_PRESS_SMTP_USERNAME: ${CEDAR_PRESS_SMTP_USERNAME:-}
  CEDAR_PRESS_SMTP_PASSWORD: ${CEDAR_PRESS_SMTP_PASSWORD:-}
  CEDAR_PRESS_APP_URL: ${CEDAR_PRESS_APP_URL:-http://localhost:5173}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cedar_local
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: cedar_press
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cedar_local -d cedar_press"]
      interval: 2s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:5
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  tools:
    build:
      context: .
      dockerfile: server/Dockerfile.test
    profiles: [tools]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      <<: *stripe-environment
      PYTHONPATH: /workspace/server
      PYTHONDONTWRITEBYTECODE: "1"
      RUFF_CACHE_DIR: /tmp/ruff-cache
      DATABASE_URL: postgresql://cedar_local:local_development_only@db:5432/cedar_press
      CEDAR_PRESS_TEST_DATABASE_ADMIN_URL: postgresql://cedar_local:local_development_only@db:5432/cedar_press
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, cedar_press.migrate]

  api:
    image: cedar-press-local-tools
    profiles: [app]
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    environment:
      <<: *stripe-environment
      PYTHONPATH: /workspace/server
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://cedar_local:local_development_only@db:5432/cedar_press
      CEDAR_PRESS_ENVIRONMENT: development
      CEDAR_PRESS_INSECURE_COOKIE: "1"
      CEDAR_PRESS_TRUST_PROXY: "0"
      CEDAR_PRESS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: [python, -m, uvicorn, cedar_press.app:app, --host, 0.0.0.0, --port, "8000"]

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [app, billing]
    ports:
      - "127.0.0.1:8025:8025"

  stripe-listener:
    image: stripe/stripe-cli:v1.43.3
    profiles: [billing]
    environment:
      STRIPE_API_KEY: ${CEDAR_PRESS_STRIPE_SECRET_KEY:-${STRIPE_TEST_KEY:-}}
      STRIPE_DEVICE_NAME: cedar-press-local
    command: [listen, --latest, --forward-to, http://api:8000/billing/webhook, --events, "checkout.session.completed,checkout.session.expired,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed,invoice.updated,payment_intent.succeeded,payment_intent.payment_failed,charge.refunded,refund.updated"]

volumes:
  postgres-data:
