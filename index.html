<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The press pages hold the paper palette in both themes (press.css:
         .teim-rd--paper re-pins the light tokens over the dark remap), so the
         document declares light rather than inviting a dark canvas it would
         immediately paint over. -->
    <meta name="color-scheme" content="light" />
    <title>Cedar Press — Trusted intelligence for Indian Country</title>
    <meta
      name="description"
      content="Trusted intelligence for Indian Country: original economic collections, data-driven research and transparent method. Built by Lumecon, available exclusively through Tribal Business News."
    />
    <link rel="canonical" href="https://cedarpress.ai/" />
    <link rel="icon" type="image/png" href="/brand/lumecon-logo-mark-teal.png" />

    <!-- The faces every page paints its first screen with, fetched from the
         document rather than discovered from the stylesheet.

         Without these the chain is: HTML → stylesheet → React renders → the
         browser finally sees text that wants Inter → font request. Measured
         on a 4 Mbps / 4× CPU profile, that put the first font request at
         659ms and the last arrival at 1108ms — about 270ms AFTER first
         contentful paint. So every page painted once in the fallback and
         then re-laid itself out: nav items 63px wide becoming 66px, a hero
         section 222px tall becoming 184px, whole paragraphs stepping down
         three pixels. That second pass was the page's entire measured
         Cumulative Layout Shift, and on Collections it reached 0.119 on a
         cold load, past the 0.1 that counts as good.

         Preloading breaks the discovery chain: the fetch starts alongside
         the stylesheet instead of after the first render, so the faces are
         in cache before there is any text to paint and the page arrives
         once. Measured A/B, both builds served side by side on their own
         ports with the HTTP cache disabled and runs interleaved so machine
         load hit both arms equally: CLS went to exactly 0 on all nine
         routes, at both phone and desktop widths. It is not free — first
         contentful paint moved 50–124ms later at 4 Mbps, 20–76ms at 30 Mbps,
         because 140kB of font now competes with the bundle for the same
         pipe. Paying a tenth of a second once to stop the page rearranging
         itself under the reader is the trade this makes deliberately.

         `crossorigin` is required even though these are same-origin: fonts
         are fetched in CORS mode, and a preload without it is a second,
         wasted download rather than a warm cache.

         Only the faces the first screen uses. Inter 500 and Spectral are
         deliberately absent — neither is requested on a first paint (Spectral
         sets one italicised word), and preloading them would spend bandwidth
         the paint needs. If a page starts using one above the fold it should
         be added here, and if a face stops being used it should be removed:
         an unused preload is pure cost, and the browser will say so in the
         console. -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-800.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-700.woff2" as="font" type="font/woff2" crossorigin />

    <!-- How the service appears when a subscriber sends a link to a colleague,
         which is how a citation travels. Absolute URLs, because the crawlers
         that read these do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cedar Press" />
    <meta property="og:title" content="Trusted intelligence for Indian Country" />
    <meta
      property="og:description"
      content="Trusted intelligence for Indian Country: original economic collections, data-driven research and transparent method."
    />
    <meta property="og:url" content="https://cedarpress.ai/" />
    <meta property="og:image" content="https://cedarpress.ai/cedar-press-og-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cedar Press"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trusted intelligence for Indian Country" />
    <meta
      name="twitter:description"
      content="Trusted intelligence for Indian Country: original economic collections, data-driven research and transparent method."
    />
    <meta name="twitter:image" content="https://cedarpress.ai/cedar-press-og-1200x630.png" />

    <!-- Sent by crawlers and by browsers on every outbound request. Strict
         origin when cross-site: a colleague following a shared citation should
         not hand the destination the path a subscriber was reading. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- GitHub Pages serves static files and sets no response headers of its
         own, so the policy has to ride in the document. Two consequences worth
         knowing: `frame-ancestors` is ignored in a meta policy and can only be
         set as a header, so clickjacking protection has to come from a proxy
         or a host that can set one; and this cannot be report-only.

         `connect-src` allows the API origin and Datadog's intake. Both are
         configured at build time and neither is known here, so the wildcards
         are on the subdomain rather than the scheme — https: alone would allow
         every host on the web to be called. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'self';
               img-src 'self' data:;
               font-src 'self';
               style-src 'self' 'unsafe-inline';
               script-src 'self';
               connect-src 'self' https://*.lumecon.ai https://*.datadoghq.com https://*.datadoghq.eu;
               frame-src 'none'"
    />

    <!-- What the service is, in the form a search engine reads directly rather
         than inferring from the page. Kept to what is verifiable elsewhere on
         the site: no ratings, no counts, no claims the product does not make. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://cedarpress.ai/#website",
            "url": "https://cedarpress.ai/",
            "name": "Cedar Press",
            "description": "Trusted intelligence for Indian Country: original economic collections, data-driven research and transparent method.",
            "inLanguage": "en",
            "publisher": { "@id": "https://lumecon.ai/#organization" }
          },
          {
            "@type": "Organization",
            "@id": "https://lumecon.ai/#organization",
            "name": "Lumecon",
            "url": "https://lumecon.ai",
            "email": "contact@lumecon.ai"
          },
          {
            "@type": "Product",
            "name": "Cedar Press",
            "url": "https://cedarpress.ai/",
            "brand": { "@id": "https://lumecon.ai/#organization" },
            "description": "A subscriber intelligence service covering the money, policy, transactions, institutions and public actions that shape Indian Country's economy. Every collection begins with public records and carries its own citation.",
            "category": "Economic data and research"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
