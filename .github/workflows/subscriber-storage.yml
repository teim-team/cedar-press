name: Subscriber storage contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscriber-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same server/Dockerfile.test, PostgreSQL fixtures and command used locally.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build database test tools
        run: docker compose build tools
      - name: Exercise database contracts without silent skips
        run: make db-test
      - name: Database diagnostics
        if: failure()
        run: docker compose logs db
      - name: Remove disposable CI database
        if: always()
        run: docker compose down --volumes
