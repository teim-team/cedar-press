name: Subscriber storage contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subscriber-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Disposable runner-only fixture. No production credentials or deployment.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cedar_fixture
          POSTGRES_PASSWORD: disposable_ci_fixture
          POSTGRES_DB: cedar_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cedar_fixture -d cedar_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CEDAR_PRESS_TEST_DATABASE_URL: postgresql://cedar_fixture:disposable_ci_fixture@127.0.0.1:5432/cedar_fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
      - run: pip install -e 'server[dev,postgres]'
      - name: Exercise existing database contracts without silent skips
        run: |
          python - <<'PY'
          import sys
          import os
          import unittest
          import psycopg
          # The existing connected-backend tests exercise teim-app's optional
          # users seam. This fixture owns only this disposable CI database.
          # The standalone test creates a second database with no users table.
          with psycopg.connect(os.environ["CEDAR_PRESS_TEST_DATABASE_URL"]) as connection:
              connection.execute("""
                  CREATE TABLE users (
                      id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                      email TEXT NOT NULL UNIQUE,
                      password_hash TEXT NOT NULL,
                      workspace_tier TEXT
                  )
              """)
          sys.path.insert(0, "server")
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              "tests.test_subscribers",
              "tests.test_priorities",
              "tests.test_release_download",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              raise SystemExit("Database contract run unexpectedly skipped tests")
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
