# cedarpress.ai is served from S3 behind CloudFront, NOT from GitHub Pages
# (docs/HOSTNAMES.md). This workflow was called "Deploy to GitHub Pages" for
# its first hundred runs and the name outlived the truth by two months: it
# sent two separate readers to diagnose a dead site by looking at Pages, which
# is the one destination nobody reaches. The name is the first thing anyone
# reads on a red run, so it names the thing that matters.
name: Publish cedarpress.ai

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gates, then the build that both destinations publish. No credentials: this
  # job holds none and needs none, so a failure here is always about the code.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Smoke tests run a browser over the built site. Chromium only: these
      # are the critical paths, not a compatibility matrix, and the phone
      # project runs the mobile profile on the same engine.
      #
      # This step BUILDS as well as tests: playwright.config.js starts the
      # server with `npm run build`, configured with a throwaway demo account
      # of its own. That is why the deployed build is the last step in this
      # job and not this one — a build placed before the smoke run would be
      # overwritten by it, and the site would ship the test fixture as its
      # sign-in.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      # The API ships with the client, so its checks gate the same pipeline.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e server[dev] httpx
      - run: ruff check server
      - working-directory: server
        run: python -m unittest discover -s tests -t .
      # The build that is actually deployed, and the only place this
      # repository's two settings are read.
      #
      #   vars.VITE_API_URL      Repository variable. Unset (the default) is
      #                          STANDALONE: the client serves the bundled
      #                          catalog and the demo gate below is the
      #                          sign-in. Set it to the Cedar platform API and
      #                          the deployment is CONNECTED — real sessions,
      #                          signed HTTP-only cookies, activation — and
      #                          the demo gate turns itself off, because every
      #                          module discriminates on `isConnected()`.
      #                          A settings change, deliberately, not a code
      #                          change.
      #
      #   secrets.VITE_PRESS_DEMO_ACCOUNTS
      #                          The standalone preview account: an email and
      #                          a SALTED SHA-256 DIGEST, never a password.
      #                          Unset means a build that signs nobody in,
      #                          which is the correct default. Held as a
      #                          secret so it stays out of the job log — not
      #                          because it is protected: it ships in a public
      #                          static bundle and anyone can read it there.
      #                          See src/features/grove/pressDemoGate.js.
      #
      # `build:site` builds and then prerenders the three public pages to
      # static HTML (scripts/prerender.mjs) with the Chromium the smoke step
      # installed, so a crawler reads the door, the tribal data request
      # policy and research access as text rather than an empty root.
      - run: npm run build:site
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PRESS_DEMO_ACCOUNTS: ${{ secrets.VITE_PRESS_DEMO_ACCOUNTS }}
      # `dist-site`, not `dist`: the data workspace tracks 295 files under
      # `dist/` and vite empties its output directory before every build. The
      # two must move together with `build.outDir` in vite.config.js.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site
      # The same build again, as an ordinary artifact, because the Pages
      # artifact is a tarball in a format only `deploy-pages` reads. Publishing
      # the identical bytes to both destinations is the point: rebuilding in
      # the S3 job would let the two drift, and a drift between what Pages
      # serves and what CloudFront serves is invisible until it matters.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist-site
          retention-days: 1

  # ── Two destinations, two jobs, two independent verdicts ──────────────────
  #
  # These were one job until 2026-09-21, with the S3 publish as the last steps
  # of `build`. That coupling cost real time: the IAM trust for
  # `cedarpress-site-deploy` has never accepted this repository's OIDC token,
  # so `configure-aws-credentials` failed at the end of every run, failed the
  # whole `build` job with it, and the Pages job — `needs: build` — was SKIPPED
  # eleven runs in a row. One broken trust policy took down both destinations
  # and reported it as a single red X on a job whose every gate had passed.
  #
  # Apart now. Each destination reports its own verdict, `needs: build` alone,
  # and neither can skip the other. What one of them failing means is legible
  # from the job name without opening a log.

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  s3:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist-site
      # Assumes IAM role `cedarpress-site-deploy` in account 502309351676
      # through GitHub OIDC. If this step fails with
      #
      #   Could not assume role with OIDC:
      #   Not authorized to perform sts:AssumeRoleWithWebIdentity
      #
      # the fault is in AWS and nothing in this repository can make it pass:
      # STS refuses the exchange before the role's permissions are consulted.
      # docs/HOSTNAMES.md carries the two commands that say which of the two
      # causes it is, and a paste-ready trust policy.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::502309351676:role/cedarpress-site-deploy
          aws-region: us-east-1
      # Two syncs, because the two halves want opposite cache lives: the
      # entry documents must be re-fetched (10 minutes) while the hashed
      # assets they point at never change under their own names (a year,
      # immutable). CNAME is excluded — it belongs to the Pages copy and
      # CloudFront has no use for it.
      - run: |
          aws s3 sync dist-site s3://cedarpress-ai-site-502309351676 --delete --exclude CNAME --exclude 'assets/*' --cache-control 'public, max-age=600'
          aws s3 sync dist-site/assets s3://cedarpress-ai-site-502309351676/assets --delete --cache-control 'public, max-age=31536000, immutable'
          aws cloudfront create-invalidation --distribution-id E3AEMUAUDGWNTQ --paths '/*'
