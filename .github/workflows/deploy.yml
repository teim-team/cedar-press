name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # Smoke tests run a browser over the built site. Chromium only: these
      # are the critical paths, not a compatibility matrix, and the phone
      # project runs the mobile profile on the same engine.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      # The API ships with the client, so its checks gate the same pipeline.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e server[dev] httpx
      - run: ruff check server
      - working-directory: server
        run: python -m unittest discover -s tests -t .
      # `dist-site`, not `dist`: the data workspace tracks 295 files under
      # `dist/` and vite empties its output directory before every build. The
      # two must move together with `build.outDir` in vite.config.js.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
