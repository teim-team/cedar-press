name: Deploy Cedar Press API

on:
  push:
    branches: [main]
    paths:
      - server/**
      - data/**
      - public/data/cedar/**
      - infra/deploy.sh
      - .github/workflows/deploy-api.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
      AWS_ACCOUNT_ID: ${{ inputs.environment == 'prod' && '502309351676' || '473387994903' }}
      AWS_REGION: us-east-1
    steps:
      - name: Prod deploys come from main only
        if: env.DEPLOY_ENV == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prod deploys must run from main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/cedar-press-${{ env.DEPLOY_ENV }}-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push the image
        id: image
        run: |
          set -euo pipefail
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -f server/Dockerfile -t "$REGISTRY/cedar-press-api:${GITHUB_SHA}" .
          docker push "$REGISTRY/cedar-press-api:${GITHUB_SHA}"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSM
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=cedar-press-${DEPLOY_ENV}-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running host named cedar-press-${DEPLOY_ENV}-app"
            exit 1
          fi

          # The script holds no secrets; it reads them from Parameter Store on the host.
          SCRIPT="$(base64 -w0 infra/deploy.sh)"
          COMMAND="mkdir -p /opt/cedar-press && echo ${SCRIPT} | base64 -d > /opt/cedar-press/deploy.sh && chmod 0700 /opt/cedar-press/deploy.sh && /opt/cedar-press/deploy.sh ${REGISTRY} ${GITHUB_SHA} ${DEPLOY_ENV}"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg c "$COMMAND" '{commands: [$c]}')" \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)"

          STATUS=0
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || STATUS=$?
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
          exit "$STATUS"
